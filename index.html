<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falconik Agência — Nossa marca está se renovando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="frame">

    <img src="assets/background.webp" alt="" class="frame__bg" aria-hidden="true">

    <div class="content">

      <div class="content-right">

        <img src="assets/falconik-logo-application.svg" alt="Falconik Agência" class="logo-application">

        <div class="content-text">
          <h1 class="title">Nossa marca está se renovando.</h1>

          <p class="txt-1">
            Em breve, nosso novo site estará no ar, com toda a experiência da
            Falconik em comunicação visual: do editorial ao técnico, do
            impresso ao digital.
          </p>

          <p class="txt-2">Enquanto isso, estamos a um WhatsApp de distância.</p>

          <button class="btn-contato" id="btnContato" type="button" aria-label="Falar no WhatsApp: (51) 992 404 519">
            <span class="btn-contato__icon">
              <img src="assets/whatsapp-icon.svg" alt="" width="58" height="58">
            </span>
            <span class="btn-contato__text">
              <span class="btn-contato__label">VAMOS CONVERSAR?</span>
              <span class="btn-contato__phone">(51) 992 404 519</span>
            </span>
          </button>

        </div>
      </div>

      <div class="content-left">
        <img src="assets/falconik-logo-vertical.svg" alt="Falconik — símbolo do falcão" class="falcon-vertical">
      </div>

    </div>

    <footer class="footer">
      <p class="txt-slogan">COMUNICAÇÃO&nbsp;&bull;&nbsp;DESIGN&nbsp;&bull;&nbsp;TÉCNICA</p>
      <div class="footer__line" aria-hidden="true">
        <span class="footer__line-track"></span>
        <span class="footer__line-dot"></span>
      </div>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
